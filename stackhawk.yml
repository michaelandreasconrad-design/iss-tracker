app:
  applicationId: 7d005016-4be1-4a18-be45-b37c79c85b99
  env: ${APP_ENV:Production}
  host: ${APP_HOST:http://localhost:3000}

# Die Seite ist eine clientseitig gerenderte React-App (Next.js) mit einer API-Route.
# Ajax Spider findet die Inhalte, /api/astros wird gezielt vorgegeben (keine OpenAPI-Spezifikation vorhanden).
hawk:
  spider:
    ajax: true
    seedPaths:
      - /api/astros

tags:
  - name: _STACKHAWK_AGENT
    value: ${HAWK_AGENT:none}
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: _STACKHAWK_GIT_BRANCH
    value: ${BRANCH_NAME:none}
  - name: git_origin
    value: michaelandreasconrad-design/iss-tracker
